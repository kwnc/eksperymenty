<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteNest - Simple Note Taking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>NoteNest</h1>
            <p class="subtitle">Your simple note-taking companion</p>
        </header>

        <div class="tag-filter">
            <label for="tag-filter-select">Filter by tag:</label>
            <select id="tag-filter-select">
                <option value="all">All Notes</option>
            </select>
        </div>

        <main>
            <section class="note-editor">
                <h2 id="editor-title">Create New Note</h2>
                <input type="text" id="note-title" placeholder="Note title..." />
                <textarea id="note-content" placeholder="Start typing your note..."></textarea>

                <div class="tags-input-container">
                    <input type="text" id="note-tags" placeholder="Add tags (comma-separated)..." />
                    <small>Example: work, ideas, personal</small>
                </div>

                <div class="button-group">
                    <button id="save-note-btn" class="btn-primary">Save Note</button>
                    <button id="cancel-edit-btn" class="btn-secondary" style="display: none;">Cancel</button>
                </div>
            </section>

            <section class="notes-list">
                <h2>Your Notes</h2>
                <div id="notes-container">
                    <p class="empty-state">No notes yet. Create your first note above!</p>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
