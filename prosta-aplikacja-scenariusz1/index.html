<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes - Local MVP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quick Notes</h1>
            <p class="subtitle">Local note-taking app</p>
        </header>

        <div class="note-input-section">
            <input type="text" id="noteTitle" placeholder="Note title..." maxlength="100">
            <textarea id="noteContent" placeholder="Write your note here..." rows="4"></textarea>
            <button id="addNoteBtn" class="btn-primary">Add Note</button>
        </div>

        <div class="notes-section">
            <h2>Your Notes</h2>
            <div id="notesList" class="notes-list">
                <!-- Notes will be dynamically inserted here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
