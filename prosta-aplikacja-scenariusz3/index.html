<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Local MVP Note Taking Application - Simple, fast, and private">
    <title>My Notes</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <!-- Main Application Container -->
    <div id="app" class="app-container">

        <!-- Header -->
        <header class="app-header">
            <h1 class="app-title">My Notes</h1>
            <div class="app-controls">
                <input
                    type="search"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search notes..."
                    aria-label="Search notes"
                >
                <button
                    id="btnNewNote"
                    class="btn btn-primary btn-new-note"
                    aria-label="Create new note"
                >
                    + New Note
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main">

            <!-- Notes List Sidebar -->
            <aside id="notesList" class="notes-list-container">
                <!-- Notes list will be rendered here by notesList.js -->
                <div class="notes-list">
                    <div class="empty-state">
                        <p>No notes yet.</p>
                        <p class="empty-state-hint">Click "New Note" to get started!</p>
                    </div>
                </div>
            </aside>

            <!-- Note Editor Area -->
            <section id="noteEditor" class="note-editor-container">
                <!-- Note editor will be rendered here by noteEditor.js -->
                <div class="note-editor">
                    <div class="empty-editor-state">
                        <p>Select a note or create a new one to start writing.</p>
                    </div>
                </div>
            </section>

        </main>

        <!-- Footer with Storage Info -->
        <footer class="app-footer">
            <div class="storage-info">
                <span id="storageIndicator">Storage: 0 KB used</span>
            </div>
            <div class="app-info">
                <span>Local Note Taking App v1.0</span>
            </div>
        </footer>

    </div>

    <!-- Confirmation Modal (for delete confirmations) -->
    <div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h2 id="modalTitle" class="modal-title">Confirm Action</h2>
            <p id="modalMessage" class="modal-message">Are you sure?</p>
            <div class="modal-actions">
                <button id="btnModalCancel" class="btn btn-secondary">Cancel</button>
                <button id="btnModalConfirm" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="alert" aria-live="polite" aria-hidden="true">
        <span id="toastMessage"></span>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
