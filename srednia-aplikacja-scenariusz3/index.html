<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NoteNest - A clean, minimalist local note-taking web application">
    <meta name="author" content="NoteNest Development Team">
    <title>NoteNest - Local Note Taking</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">NoteNest</h1>
            <button id="new-note-btn" class="btn btn-primary">+ New Note</button>
        </header>

        <main class="app-main">
            <aside class="sidebar">
                <div class="search-section">
                    <input type="text" id="search-input" class="search-input" placeholder="Search notes...">
                </div>

                <div class="filter-section">
                    <h3>Filter by Tags</h3>
                    <div id="tag-filters" class="tag-filters">
                        <!-- Tag filters will be dynamically generated -->
                    </div>
                    <button id="clear-filters-btn" class="btn btn-secondary">Clear Filters</button>
                </div>

                <div class="stats-section">
                    <p id="note-count" class="note-count">0 notes</p>
                </div>
            </aside>

            <section class="content-area">
                <div id="notes-list" class="notes-list">
                    <!-- Notes will be dynamically generated -->
                </div>

                <div id="empty-state" class="empty-state">
                    <h2>Welcome to NoteNest</h2>
                    <p>Create your first note to get started!</p>
                    <button class="btn btn-primary">+ Create Note</button>
                </div>
            </section>
        </main>

        <!-- Note Editor Modal -->
        <div id="note-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">New Note</h2>
                    <button id="close-modal-btn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <form id="note-form">
                        <div class="form-group">
                            <label for="note-title">Title</label>
                            <input type="text" id="note-title" class="form-input" placeholder="Enter note title..." required>
                        </div>

                        <div class="form-group">
                            <label for="note-content">Content</label>
                            <textarea id="note-content" class="form-textarea" placeholder="Write your note here..." rows="12" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="note-tags">Tags</label>
                            <input type="text" id="note-tags" class="form-input" placeholder="Enter tags separated by commas...">
                            <small class="form-help">Separate tags with commas (e.g., work, important, ideas)</small>
                        </div>

                        <div class="form-actions">
                            <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                            <button type="submit" id="save-btn" class="btn btn-primary">Save Note</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
